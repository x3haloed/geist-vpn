<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geist VPN</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="app-title">Geist VPN</h1>
                <div class="connection-status" id="connection-status">
                    <div class="status-indicator" id="status-indicator"></div>
                    <span id="status-text">Disconnected</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Connection Panel -->
            <div class="panel connection-panel">
                <h2 class="panel-title">Quick Connect</h2>
                <div class="profile-selector">
                    <select id="profile-select" class="profile-select">
                        <option value="">Select a profile...</option>
                    </select>
                    <button id="connect-btn" class="btn btn-primary connect-btn">
                        <span class="btn-text">Connect</span>
                        <div class="btn-spinner" id="connect-spinner"></div>
                    </button>
                </div>
                <div class="connection-info" id="connection-info"></div>
            </div>

            <!-- Profiles Panel -->
            <div class="panel profiles-panel">
                <div class="panel-header">
                    <h2 class="panel-title">VPN Profiles</h2>
                    <button id="add-profile-btn" class="btn btn-secondary">Add Profile</button>
                </div>
                <div class="profiles-list" id="profiles-list">
                    <div class="empty-state">
                        <p>No VPN profiles configured yet.</p>
                        <p>Click "Add Profile" to get started.</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Profile Modal -->
        <div class="modal" id="profile-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-title">Add VPN Profile</h3>
                    <button class="modal-close" id="modal-close">&times;</button>
                </div>
                <form id="profile-form" class="profile-form">
                    <div class="form-group">
                        <label for="profile-name">Profile Name</label>
                        <input type="text" id="profile-name" required>
                    </div>
                    <div class="form-group">
                        <label for="profile-host">Server Host</label>
                        <input type="text" id="profile-host" placeholder="vpn.example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="profile-port">Port</label>
                        <input type="number" id="profile-port" value="443" min="1" max="65535" required>
                    </div>
                    <div class="form-group">
                        <label for="profile-protocol">Protocol</label>
                        <select id="profile-protocol">
                            <option value="SslVpn">SSL VPN</option>
                            <option value="L2Tp">L2TP</option>
                            <option value="OpenVpn">OpenVPN</option>
                            <option value="Sstp">SSTP</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="profile-account">Account Name (optional)</label>
                        <input type="text" id="profile-account" placeholder="username">
                    </div>
                    <div class="form-group">
                        <label for="profile-timeout">Connection Timeout (seconds)</label>
                        <input type="number" id="profile-timeout" value="30" min="5" max="300">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="save-profile-btn">
                            <span class="btn-text">Save Profile</span>
                            <div class="btn-spinner" id="save-spinner"></div>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Status Modal -->
        <div class="modal" id="status-modal">
            <div class="modal-content status-modal-content">
                <h3>Connection Status</h3>
                <div id="status-details"></div>
                <button class="btn btn-primary" id="close-status-btn">Close</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
