[package]
name = "geist-vpn"
version = "0.1.0"
description = "Modern Rust GUI for SoftEtherVPN"
authors = ["You <your.email@example.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/x3haloed/geist-vpn"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
cmake = "0.1"
pkg-config = "0.3"

[dependencies]
# Iced for native cross-platform GUI
iced = { version = "0.13", features = ["tokio", "image", "svg", "advanced"] }
iced_runtime = "0.13"
iced_futures = "0.13"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }

flume = "0.10"

# FFI and unsafe code
libc = "0.2"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
serde_yaml = "0.9"

# Async runtime
futures = "0.3"

# Directories
dirs = "5.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Global state management
once_cell = "1.0"

[features]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[example]]
name = "standalone_test"
path = "examples/standalone_test.rs"

[profile.release]
panic = "abort"   # Strip costly panic clean-up logic
codegen-units = 1 # Compile crates one by one so the compiler can optimize better
lto = true        # Enables link-time optimization
opt-level = "s"   # Optimize for binary size
strip = true      # Strip debug symbols
